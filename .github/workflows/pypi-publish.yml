name: PyPI Publish Workflow

on:
  workflow_call:
    inputs:
      pypi-project-name:
        description: 'PyPI project name (defaults to repository name)'
        required: false
        type: string
        default: ''
      script-ref:
        description: 'Git ref of .common repo to use for scripts (default: main)'
        required: false
        type: string
        default: 'main'
    secrets:
      PYPI_TOKEN:
        description: 'PyPI API token for authentication'
        required: true

jobs:
  publish:
    name: Publish to PyPI (${{ github.ref_name }})
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/${{ inputs.pypi-project-name || github.event.repository.name }}
    permissions:
      contents: read
      # id-token: write # Not needed when using API token
    env:
      UV_PYTHON: "3.11"
      PROJECT_NAME: ${{ inputs.pypi-project-name || github.event.repository.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout common workflows
        uses: actions/checkout@v5
        with:
          repository: fugue-project/.common
          ref: ${{ inputs.script-ref }}
          path: .common-workflows
          sparse-checkout: |
            scripts/validate_release.py

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          cache-dependency-glob: "pyproject.toml"

      - name: Setup devenv
        run: make devenv

      - name: Validate release tag
        run: uv run python .common-workflows/scripts/validate_release.py $PROJECT_NAME

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}
